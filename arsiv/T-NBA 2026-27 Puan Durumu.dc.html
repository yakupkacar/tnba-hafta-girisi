<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-785da292-216d-47a9-800f-8e6c4680f25f/styles.css">
<script src="_ds/modernist-785da292-216d-47a9-800f-8e6c4680f25f/_ds_bundle.js"></script>
<style>body{margin:0;background:#e4e2df} a{color:var(--color-accent,#ec3013);text-decoration:none} a:hover{color:var(--color-accent-700,#a02613)}</style>
<script src="image-slot.js"></script>
</helmet>
<div data-screen-label="Puan Durumu 26-27" style="width:1080px;height:1920px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--color-bg,#f3f2f2);color:var(--color-text,#201e1d);font-family:var(--font-body,'Archivo',sans-serif);display:flex;flex-direction:column;padding:56px 64px 44px">
  <div style="display:flex;align-items:center;gap:22px;padding-bottom:22px;border-bottom:2px solid var(--color-text,#201e1d)">
    <img src="assets/tnba-logo-pro.png" alt="T-NBA" style="width:72px;height:72px;border-radius:50%;box-shadow:0 0 0 2px var(--color-text,#201e1d)"></img>
    <div style="font-size:27px;font-weight:900;letter-spacing:0.1em;white-space:nowrap">T-NBA CHAMPIONSHIP</div>
    <div style="margin-left:auto;background:var(--color-accent,#ec3013);color:#fff;font-size:16px;font-weight:800;letter-spacing:0.18em;padding:10px 18px;white-space:nowrap">2026-27 SEZONU</div>
  </div>
  <div style="padding:34px 0 26px">
    <div style="font-size:21px;font-weight:800;letter-spacing:0.28em;color:var(--color-accent,#ec3013);margin-bottom:14px">PUAN DURUMU — RESMİ SIRALAMA</div>
    <div style="font-family:var(--font-heading,'Archivo',sans-serif);font-size:136px;font-weight:900;line-height:0.9;letter-spacing:-0.01em">{{ hafta }}. HAFTA</div>
  </div>
  <div style="display:grid;grid-template-columns:92px 64px 1fr 150px 210px;align-items:center;border-top:2px solid var(--color-text,#201e1d);border-bottom:2px solid var(--color-text,#201e1d);padding:13px 0;font-size:16px;font-weight:800;letter-spacing:0.22em;color:rgba(32,30,29,0.55)">
    <div>#</div><div></div><div>TAKIM</div><div style="text-align:right">W-L-T</div><div style="text-align:right">FORM</div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column">
    <sc-for list="{{ rows }}" as="row" hint-placeholder-count="18">
      <div>
        <div style="display:grid;grid-template-columns:92px 64px 1fr 150px 210px;align-items:center;height:72px;border-bottom:1px solid rgba(32,30,29,0.14)">
          <div style="display:flex;align-items:center;gap:8px">
            <sc-if value="{{ row.top }}" hint-placeholder-val="{{ false }}"><div style="font-size:34px;font-weight:900;color:var(--color-accent,#ec3013)">{{ row.r }}</div></sc-if>
            <sc-if value="{{ row.ntop }}" hint-placeholder-val="{{ true }}"><div style="font-size:34px;font-weight:900;color:rgba(32,30,29,0.45)">{{ row.r }}</div></sc-if>
            <sc-if value="{{ row.up }}" hint-placeholder-val="{{ false }}"><div style="font-size:13px;color:var(--color-accent,#ec3013)">▲</div></sc-if>
            <sc-if value="{{ row.down }}" hint-placeholder-val="{{ false }}"><div style="font-size:13px;color:rgba(32,30,29,0.4)">▼</div></sc-if>
          </div>
          <img src="{{ row.logo }}" alt="" style="flex-shrink:0;width:68px;height:68px;object-fit:contain;display:block"></img>
          <div style="display:flex;align-items:center;gap:14px;min-width:0;padding:0 12px 0 18px">
            <div style="min-width:0;font-size:27px;font-weight:700;white-space:nowrap">{{ row.n }}</div>
            <sc-if value="{{ row.ws }}" hint-placeholder-val="{{ false }}"><div style="flex-shrink:0;border:2px solid var(--color-accent,#ec3013);color:var(--color-accent,#ec3013);padding:2px 9px;font-size:13px;font-weight:900;letter-spacing:0.08em">{{ row.streak }}</div></sc-if>
            <sc-if value="{{ row.ls }}" hint-placeholder-val="{{ false }}"><div style="flex-shrink:0;border:2px solid rgba(32,30,29,0.3);color:rgba(32,30,29,0.45);padding:2px 9px;font-size:13px;font-weight:900;letter-spacing:0.08em">{{ row.streak }}</div></sc-if>
          </div>
          <div style="text-align:right;font-size:27px;font-weight:800;font-variant-numeric:tabular-nums">{{ row.rec }}</div>
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <sc-for list="{{ row.form }}" as="f" hint-placeholder-count="5">
              <sc-if value="{{ f.w }}" hint-placeholder-val="{{ true }}"><div style="width:26px;height:26px;display:grid;place-items:center;background:var(--color-text,#201e1d);color:var(--color-bg,#f3f2f2);font-size:13px;font-weight:900">W</div></sc-if>
              <sc-if value="{{ f.l }}" hint-placeholder-val="{{ false }}"><div style="width:26px;height:26px;display:grid;place-items:center;border:1px solid rgba(32,30,29,0.3);box-sizing:border-box;color:rgba(32,30,29,0.4);font-size:13px;font-weight:800">L</div></sc-if>
              <sc-if value="{{ f.t }}" hint-placeholder-val="{{ false }}"><div style="width:26px;height:26px;display:grid;place-items:center;border:2px solid var(--color-accent,#ec3013);box-sizing:border-box;color:var(--color-accent,#ec3013);font-size:13px;font-weight:800">T</div></sc-if>
            </sc-for>
          </div>
        </div>
        <sc-if value="{{ row.cut }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;gap:16px;height:42px">
            <div style="font-size:15px;font-weight:900;letter-spacing:0.3em;color:var(--color-accent,#ec3013);white-space:nowrap">PLAYOFF SINIRI</div>
            <div style="flex:1;height:2px;background:var(--color-accent,#ec3013)"></div>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:2px solid var(--color-text,#201e1d);font-size:15px;font-weight:700;letter-spacing:0.22em;color:rgba(32,30,29,0.55)">
    <div style="white-space:nowrap">T-NBA CHAMPIONSHIP</div><div style="white-space:nowrap">2026-27 SEZONU</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920}}">
class Component extends DCLogic {
  state = { d: null };
  componentDidMount() { import('./tnba-data.js').then(m => { this.setState({ d: m }); import('./tnba-logo-fx.js').then(fx => fx.processTeams(m.TEAMS)).then(T => this.setState({ d: { ...m, TEAMS: T } })); }); }
  renderVals() {
    const d = this.state.d;
    if (!d) return { hafta: "", rows: [] };
    const T = d.TEAMS;
    const rows = d.WEEK.standings.map(a => {
      const f = a.form;
      let i = f.length - 1, ch = f[i], s = 1;
      while (i - 1 >= 0 && f[i - 1] === ch) { s++; i--; }
      return {
        r: a.r, n: a.n, m: T[a.n][0], c: T[a.n][1], logo: T[a.n][2], rec: a.rec,
        top: a.r <= 3, ntop: a.r > 3, cut: a.r === 8,
        up: a.prev != null && a.prev > a.r, down: a.prev != null && a.prev < a.r,
        ws: ch === "W" && s >= 3, ls: ch === "L" && s >= 3, streak: s + ch,
        form: f.split("").map(x => ({ w: x === "W", l: x === "L", t: x === "T" }))
      };
    });
    return { hafta: d.WEEK.hafta, rows };
  }
}
</script>
</body>
</html>
