<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-785da292-216d-47a9-800f-8e6c4680f25f/styles.css">
<script src="_ds/modernist-785da292-216d-47a9-800f-8e6c4680f25f/_ds_bundle.js"></script>
<style>body{margin:0;background:#e4e2df} a{color:var(--color-accent,#ec3013);text-decoration:none} a:hover{color:var(--color-accent-700,#a02613)}</style>
<script src="image-slot.js"></script>
</helmet>
<div data-screen-label="Haftanin Enleri 26-27" style="width:1080px;height:1920px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--color-bg,#f3f2f2);color:var(--color-text,#201e1d);font-family:var(--font-body,'Archivo',sans-serif);display:flex;flex-direction:column;padding:56px 64px 44px">
  <div style="display:flex;align-items:center;gap:22px;padding-bottom:22px;border-bottom:2px solid var(--color-text,#201e1d)">
    <img src="assets/tnba-logo-pro.png" alt="T-NBA" style="width:72px;height:72px;border-radius:50%;box-shadow:0 0 0 2px var(--color-text,#201e1d)"></img>
    <div style="font-size:27px;font-weight:900;letter-spacing:0.1em;white-space:nowrap">T-NBA CHAMPIONSHIP</div>
    <div style="margin-left:auto;background:var(--color-accent,#ec3013);color:#fff;font-size:16px;font-weight:800;letter-spacing:0.18em;padding:10px 18px;white-space:nowrap">2026-27 SEZONU</div>
  </div>
  <div style="padding:34px 0 26px">
    <div style="font-size:21px;font-weight:800;letter-spacing:0.28em;color:var(--color-accent,#ec3013);margin-bottom:14px">HAFTANIN EN'LERİ — LİG LİDERLERİ</div>
    <div style="font-family:var(--font-heading,'Archivo',sans-serif);font-size:136px;font-weight:900;line-height:0.9;letter-spacing:-0.01em">{{ hafta }}. HAFTA</div>
  </div>
  <div style="display:grid;grid-template-columns:270px 1fr 360px;align-items:center;border-top:2px solid var(--color-text,#201e1d);border-bottom:2px solid var(--color-text,#201e1d);padding:13px 0;font-size:16px;font-weight:800;letter-spacing:0.22em;color:rgba(32,30,29,0.55)">
    <div>KATEGORİ</div><div>DEĞER</div><div style="text-align:right">TAKIM</div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column">
    <sc-for list="{{ cats }}" as="c" hint-placeholder-count="11">
      <div style="flex:1;display:grid;grid-template-columns:270px 1fr 360px;align-items:center;border-bottom:1px solid rgba(32,30,29,0.14)">
        <div>
          <div style="font-size:31px;font-weight:900;letter-spacing:0.02em">{{ c.code }}</div>
          <div style="margin-top:5px;font-size:13px;font-weight:700;letter-spacing:0.14em;color:rgba(32,30,29,0.5)">{{ c.desc }}</div>
        </div>
        <div style="font-size:54px;font-weight:900;font-variant-numeric:tabular-nums">{{ c.val }}</div>
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:14px;min-width:0">
          <div style="font-size:24px;font-weight:700;text-align:right;white-space:nowrap">{{ c.team }}</div>
          <img src="{{ c.tlogo }}" alt="" style="flex-shrink:0;width:73px;height:73px;object-fit:contain;display:block"></img>
        </div>
      </div>
    </sc-for>
  </div>
  <sc-if value="{{ domShow }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top:20px;background:var(--color-accent,#ec3013);color:#fff;display:flex;align-items:center;gap:16px;padding:14px 22px">
      <div style="flex-shrink:0;width:42px;height:42px;border:2px solid #fff;box-sizing:border-box;display:grid;place-items:center;font-size:14px;font-weight:800">{{ domM }}</div>
      <div style="font-size:20px;font-weight:800;letter-spacing:0.1em;white-space:nowrap">HAFTANIN HÂKİMİ — {{ domTeam }} · {{ domCount }} KATEGORİ</div>
    </div>
  </sc-if>
  <div style="margin-top:20px;display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:2px solid var(--color-text,#201e1d);font-size:15px;font-weight:700;letter-spacing:0.22em;color:rgba(32,30,29,0.55)">
    <div style="white-space:nowrap">T-NBA CHAMPIONSHIP</div><div style="white-space:nowrap">2026-27 SEZONU</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920}}">
class Component extends DCLogic {
  state = { d: null };
  componentDidMount() { import('./tnba-data.js').then(m => { this.setState({ d: m }); import('./tnba-logo-fx.js').then(fx => fx.processTeams(m.TEAMS)).then(T => this.setState({ d: { ...m, TEAMS: T } })); }); }
  renderVals() {
    const d = this.state.d;
    if (!d) return { hafta: "", cats: [], domShow: false, domTeam: "", domCount: "", domM: "" };
    const T = d.TEAMS;
    const cats = d.WEEK.leaders.map(c => ({ code: c[0], desc: c[1], val: c[2], team: c[3], tm: T[c[3]][0], tc: T[c[3]][1], tlogo: T[c[3]][2] }));
    const counts = {};
    cats.forEach(c => { counts[c.team] = (counts[c.team] || 0) + 1; });
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
    const domShow = !!top && top[1] >= 2;
    return {
      hafta: d.WEEK.hafta, cats, domShow,
      domTeam: domShow ? top[0].toUpperCase() : "",
      domCount: domShow ? top[1] : "",
      domM: domShow ? T[top[0]][0] : ""
    };
  }
}
</script>
</body>
</html>
