<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-785da292-216d-47a9-800f-8e6c4680f25f/styles.css">
<script src="_ds/modernist-785da292-216d-47a9-800f-8e6c4680f25f/_ds_bundle.js"></script>
<style>body{margin:0;background:#e4e2df} a{color:var(--color-accent,#ec3013);text-decoration:none} a:hover{color:var(--color-accent-700,#a02613)}</style>
<script src="image-slot.js"></script>
</helmet>
<div data-screen-label="Mac Sonuclari 26-27" style="width:1080px;height:1920px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--color-bg,#f3f2f2);color:var(--color-text,#201e1d);font-family:var(--font-body,'Archivo',sans-serif);display:flex;flex-direction:column;padding:56px 64px 44px">
  <div style="display:flex;align-items:center;gap:22px;padding-bottom:22px;border-bottom:2px solid var(--color-text,#201e1d)">
    <img src="assets/tnba-logo.png" alt="T-NBA" style="width:72px;height:72px;border-radius:50%;box-shadow:0 0 0 2px var(--color-text,#201e1d)"></img>
    <div style="font-size:27px;font-weight:900;letter-spacing:0.1em;white-space:nowrap">T-NBA CHAMPIONSHIP</div>
    <div style="margin-left:auto;background:var(--color-accent,#ec3013);color:#fff;font-size:16px;font-weight:800;letter-spacing:0.18em;padding:10px 18px;white-space:nowrap">2026-27 SEZONU</div>
  </div>
  <div style="padding:34px 0 26px">
    <div style="font-size:21px;font-weight:800;letter-spacing:0.28em;color:var(--color-accent,#ec3013);margin-bottom:14px">MAÇ SONUÇLARI — FINAL</div>
    <div style="font-family:var(--font-heading,'Archivo',sans-serif);font-size:136px;font-weight:900;line-height:0.9;letter-spacing:-0.01em">{{ hafta }}. HAFTA</div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;gap:14px;border-top:2px solid var(--color-text,#201e1d);padding-top:22px">
    <sc-for list="{{ games }}" as="g" hint-placeholder-count="9">
      <div style="position:relative;flex:1;display:grid;grid-template-columns:1fr 210px 1fr;align-items:center;background:#fbfaf9;border:1px solid rgba(32,30,29,0.22);padding:0 26px;overflow:hidden">
        <div style="position:absolute;left:0;top:0;bottom:0;width:6px;background:{{ g.lc }}"></div>
        <div style="position:absolute;right:0;top:0;bottom:0;width:6px;background:{{ g.rc }}"></div>
        <sc-if value="{{ g.hasTag }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:0;right:26px;background:var(--color-accent,#ec3013);color:#fff;padding:4px 12px;font-size:11px;font-weight:900;letter-spacing:0.18em">{{ g.tag }}</div></sc-if>
        <div style="display:flex;align-items:center;gap:16px;min-width:0">
          <div style="flex-shrink:0;width:48px;height:48px;border:2px solid {{ g.lc }};box-sizing:border-box;background:#fff;overflow:hidden;position:relative;display:grid;place-items:center;font-size:14px;font-weight:800"><span>{{ g.lm }}</span><div style="position:absolute;inset:0"><image-slot id="tl-{{ g.lm }}" bare="true" shape="rect" placeholder="{{ g.lm }}"></image-slot></div></div>
          <div style="min-width:0">
            <sc-if value="{{ g.lw }}" hint-placeholder-val="{{ true }}"><div style="font-size:24px;font-weight:800;white-space:nowrap">{{ g.ln }}</div></sc-if>
            <sc-if value="{{ g.rw }}" hint-placeholder-val="{{ false }}"><div style="font-size:24px;font-weight:600;color:rgba(32,30,29,0.5);white-space:nowrap">{{ g.ln }}</div></sc-if>
            <sc-if value="{{ g.lw }}" hint-placeholder-val="{{ false }}"><div style="margin-top:5px;font-size:13px;font-weight:900;letter-spacing:0.26em;color:var(--color-accent,#ec3013)">KAZANAN</div></sc-if>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;gap:14px">
          <sc-if value="{{ g.lw }}" hint-placeholder-val="{{ true }}"><div style="font-size:56px;font-weight:900;font-variant-numeric:tabular-nums">{{ g.ls }}</div></sc-if>
          <sc-if value="{{ g.rw }}" hint-placeholder-val="{{ false }}"><div style="font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;color:rgba(32,30,29,0.35)">{{ g.ls }}</div></sc-if>
          <div style="width:16px;height:2px;background:rgba(32,30,29,0.35)"></div>
          <sc-if value="{{ g.rw }}" hint-placeholder-val="{{ true }}"><div style="font-size:56px;font-weight:900;font-variant-numeric:tabular-nums">{{ g.rs }}</div></sc-if>
          <sc-if value="{{ g.lw }}" hint-placeholder-val="{{ false }}"><div style="font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;color:rgba(32,30,29,0.35)">{{ g.rs }}</div></sc-if>
        </div>
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:16px;min-width:0">
          <div style="min-width:0;text-align:right">
            <sc-if value="{{ g.rw }}" hint-placeholder-val="{{ false }}"><div style="font-size:24px;font-weight:800;white-space:nowrap">{{ g.rn }}</div></sc-if>
            <sc-if value="{{ g.lw }}" hint-placeholder-val="{{ true }}"><div style="font-size:24px;font-weight:600;color:rgba(32,30,29,0.5);white-space:nowrap">{{ g.rn }}</div></sc-if>
            <sc-if value="{{ g.rw }}" hint-placeholder-val="{{ false }}"><div style="margin-top:5px;font-size:13px;font-weight:900;letter-spacing:0.26em;color:var(--color-accent,#ec3013)">KAZANAN</div></sc-if>
          </div>
          <div style="flex-shrink:0;width:48px;height:48px;border:2px solid {{ g.rc }};box-sizing:border-box;background:#fff;overflow:hidden;position:relative;display:grid;place-items:center;font-size:14px;font-weight:800"><span>{{ g.rm }}</span><div style="position:absolute;inset:0"><image-slot id="tl-{{ g.rm }}" bare="true" shape="rect" placeholder="{{ g.rm }}"></image-slot></div></div>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="margin-top:22px;display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:2px solid var(--color-text,#201e1d);font-size:15px;font-weight:700;letter-spacing:0.22em;color:rgba(32,30,29,0.55)">
    <div>T-NBA CHAMPIONSHIP</div><div>2026-27 SEZONU</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920}}">
class Component extends DCLogic {
  state = { d: null };
  componentDidMount() { import('./tnba-data.js').then(m => this.setState({ d: m })); }
  renderVals() {
    const d = this.state.d;
    if (!d) return { hafta: "", games: [] };
    const T = d.TEAMS, G = d.WEEK.matchups;
    const diffs = G.map(g => Math.abs(g[1] - g[3]));
    const iMin = diffs.indexOf(Math.min(...diffs));
    const iMax = diffs.indexOf(Math.max(...diffs));
    const games = G.map((g, i) => ({
      ln: g[0], ls: g[1], rn: g[2], rs: g[3],
      lm: T[g[0]][0], lc: T[g[0]][1], rm: T[g[2]][0], rc: T[g[2]][1],
      lw: g[1] > g[3], rw: g[3] > g[1],
      hasTag: i === iMin || i === iMax,
      tag: i === iMin ? "EN ÇEKİŞMELİ" : "EN FARKLI"
    }));
    return { hafta: d.WEEK.hafta, games };
  }
}
</script>
</body>
</html>
